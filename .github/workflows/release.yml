name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (for example, v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }} executable
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            artifact_name: JustTodoIt-windows
            executable: dist/JustTodoIt.exe
          - name: ubuntu
            os: ubuntu-latest
            artifact_name: JustTodoIt-ubuntu
            executable: dist/JustTodoIt

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build_exe.ps1

      - name: Build Ubuntu executable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x build_exe.sh
          ./build_exe.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.executable }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      REPOSITORY: ${{ github.repository }}

    steps:
      - name: Download executables
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$REPOSITORY" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$REPOSITORY" --generate-notes --title "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" --repo "$REPOSITORY" \
            release-assets/JustTodoIt-windows/JustTodoIt.exe \
            release-assets/JustTodoIt-ubuntu/JustTodoIt \
            --clobber
